*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1,.greek{font-family:"Noto Serif",Georgia,serif}
h1{font-size:2.2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{font:inherit;font-weight:700;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:18px}
.q{font-size:2.6rem;text-align:center;margin:18px 0 4px;font-weight:700;overflow-wrap:anywhere}
.q.ru{font-family:Manrope,sans-serif;font-size:2rem}
.tr{text-align:center;color:var(--muted);min-height:1.5em;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:1.05rem;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.greek{font-size:1.2rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.opt:disabled{cursor:default}
.score{font-size:3.4rem;font-weight:700;text-align:center;margin:6px 0}
.center{text-align:center;color:var(--muted)}
.miss{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.miss:first-of-type{border-top:0}
.miss span:last-child{color:var(--muted);text-align:right}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:start}
.theme{font:inherit;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
/* minimal */
:root{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#111111;--muted:#8A8A8A;--line:#E6E6E6;--accent:#111111;--accent-ink:#FFFFFF;--ok:#111111;--ok-bg:transparent;--bad:#9A9A9A;--bad-bg:transparent}

body{background:#fff;color:#000}
main{padding-top:56px;max-width:480px}
h1{font-weight:500;font-size:1.6rem}
.sub{font-size:.9rem;margin-bottom:48px}
.panel{background:none;border:0;border-radius:0;padding:0;margin-bottom:36px}
h2{font-size:.8rem;font-weight:400;color:var(--muted);margin-bottom:10px}
.chips{gap:4px 20px}

.btn{border-radius:0;font-weight:500;padding:16px}
.btn.ghost{border:0;border-top:1px solid var(--line);margin-top:0;color:var(--muted)}
.bar{height:1px;border-radius:0}
.bar>i{background:var(--ink)}
.meta{font-size:.8rem;margin-bottom:56px}
.panel .q{font-weight:500;margin-top:0}
.opts{gap:0}
.opt{border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0;background:none}
.opt:last-child{border-bottom:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--line);color:var(--muted)}
.opt.ok{border-color:var(--line);font-weight:700;box-shadow:inset 3px 0 0 var(--ink);padding-left:14px}
.opt.bad{text-decoration:line-through;color:var(--bad);border-color:var(--line)}
#next{margin-top:36px}
.score{font-weight:500}
.miss{border-color:var(--line)}
.theme{border:0;color:var(--muted)}
.opt.ok,.opt.bad{border:1.5px solid;padding:16px 14px;text-decoration:none;box-shadow:none;color:var(--ink)}
.opt.ok{border-color:#1E7A3E;background:rgba(30,122,62,.13);font-weight:700}
.opt.bad{border-color:#C0392B;background:rgba(192,57,43,.13)}
.fb{text-align:center;font-weight:700;min-height:1.6em;margin:-8px 0 18px}
.fb.ok{color:#1E7A3E}
.fb.bad{color:#C0392B}
.ring{position:relative;width:180px;margin:20px auto}
.ring svg{display:block;width:100%}
.rt{fill:none;stroke:var(--line);stroke-width:6}
.rf{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .9s ease}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:500}
.score{font-size:1rem;color:var(--muted);margin:0 0 8px}

</section>

</section>
</main>

const $ = id => document.getElementById(id);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chips(el, items, isOn, onTap){
  el.innerHTML="";
  items.forEach(([key,label])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=label;
    b.setAttribute("aria-pressed",isOn(key));
    b.onclick=()=>{onTap(key);chips(el,items,isOn,onTap);checkStart()};
    el.appendChild(b);
  });
}
function checkStart(){$("start").disabled=st.cats.size===0}
function bestKey(){return "greek-quiz-best"}
function readBest(){try{return localStorage.getItem(bestKey())}catch(e){return null}}
function saveBest(p){try{const b=+readBest()||0;if(p>b)localStorage.setItem(bestKey(),p)}catch(e){}}
function showBest(){const b=readBest();$("best").textContent=b?"Лучший результат: "+b+"%":""}

function menu(){
  const ALL=Object.keys(WORDS);
  chips($("cats"),[["__all","Все темы"],...ALL.map(k=>[k,k])],k=>k==="__all"?st.cats.size===ALL.length:st.cats.has(k),k=>{if(k==="__all"){st.cats=st.cats.size===ALL.length?new Set():new Set(ALL)}else{st.cats.has(k)?st.cats.delete(k):st.cats.add(k)}});
  chips($("dirs"),Object.entries(DIRS),k=>st.dir===k,k=>st.dir=k);
  chips($("lens"),LENS.map(n=>[n,String(n)]),k=>st.len==k,k=>st.len=+k);
  checkStart();showBest();
  show("menu");
}
function show(id){["menu","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function pool(){return [...st.cats].flatMap(c=>WORDS[c])}

function begin(words){
  st.queue=shuffle(words).slice(0,st.len);st.i=0;st.score=0;st.streak=0;st.wrong=[];
  show("quiz");ask();
}
function ask(){
  const w=st.queue[st.i];st.answered=false;
  const toRu=st.dir==="gr";
  $("prog").style.width=(st.i/st.queue.length*100)+"%";
  $("count").textContent="Вопрос "+(st.i+1)+" из "+st.queue.length;
  $("streak").textContent=st.streak>1?"Серия: "+st.streak:"";
  const q=$("word");q.textContent=toRu?w[0]:w[2];q.classList.toggle("ru",!toRu);
  $("tr").textContent=toRu?"["+w[1]+"]":"";$("fb").textContent="";$("fb").className="fb";
  const all=Object.values(WORDS).flat().filter(x=>x[0]!==w[0]);
  const opts=shuffle([w,...shuffle(all).slice(0,3)]);
  const box=$("opts");box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");b.className="opt"+(toRu?"":" greek");
    b.textContent=toRu?o[2]:o[0];
    b.onclick=()=>pick(b,o,w,opts);
    b.dataset.id=o[0];box.appendChild(b);
  });
  $("next").disabled=true;
  $("next").textContent=st.i===st.queue.length-1?"Завершить":"Дальше";
}
function pick(btn,o,w){
  if(st.answered)return;st.answered=true;
  const good=o[0]===w[0];
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.dataset.id===w[0])b.classList.add("ok")});
  if(good){st.score++;st.streak++}else{btn.classList.add("bad");st.streak=0;st.wrong.push(w)}
  $("tr").textContent="["+w[1]+"] "+(st.dir==="gr"?"":w[0]);
  if(st.dir==="ru")$("tr").textContent=w[0]+" ["+w[1]+"]";
  const f=$("fb");f.className="fb "+(good?"ok":"bad");f.textContent=good?"✓ Правильно":"✗ Неправильно — верно: "+(st.dir==="gr"?w[2]:w[0]);
  $("next").disabled=false;$("next").focus();
}
function finish(){
  const p=Math.round(st.score/st.queue.length*100);
  saveBest(p);
  $("score").textContent="Правильно: "+st.score+" из "+st.queue.length;
  $("pct").textContent=p+"%";$("rf").style.strokeDashoffset=326.7;
  setTimeout(()=>{$("rf").style.strokeDashoffset=326.7*(1-p/100)},60);
  $("msg").textContent=p===100?"Безупречно!":p>=70?"Хороший результат — "+p+"%":"Есть над чем поработать — "+p+"%";
  const m=$("miss");m.innerHTML="";
  st.wrong.forEach(w=>{const d=document.createElement("div");d.className="miss";
    d.innerHTML='<span class="greek"></span><span></span>';
    d.children[0].textContent=w[0]+" ["+w[1]+"]";d.children[1].textContent=w[2];m.appendChild(d)});
  $("missPanel").classList.toggle("hidden",!st.wrong.length);
  $("retry").classList.toggle("hidden",!st.wrong.length);
  show("result");
}
$("start").onclick=()=>begin(pool());
$("next").onclick=()=>{if(st.i>=st.queue.length-1){finish()}else{st.i++;ask()}};
$("again").onclick=()=>begin(pool());
$("retry").onclick=()=>{const w=st.wrong.slice();st.len=w.length;begin(w)};
$("toMenu").onclick=()=>{st.len=10;menu()};
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
menu();
</script>
</body>
</html>
